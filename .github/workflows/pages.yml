# 사주도감 정적 사이트(mvp/saju)를 GitHub Pages로 배포. 푸시할 때마다 자동.
name: pages
on:
  push:
    branches: ["claude/automation-business-80m-plan-u8tmhw", "main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mvp/saju
      - id: deployment
        uses: actions/deploy-pages@v4
